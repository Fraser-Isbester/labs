<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#04050a">
<title>isbester</title>
<style>
  html, body { margin: 0; height: 100%; background: #04050a; overflow: hidden; }
  body {
    background:
      radial-gradient(ellipse 80% 60% at 30% 25%, rgba(40, 48, 90, .16), transparent 70%),
      radial-gradient(ellipse 70% 50% at 75% 80%, rgba(70, 30, 70, .10), transparent 70%),
      radial-gradient(ellipse at 50% 50%, #080a14 0%, #04050a 65%, #010103 100%);
    cursor: crosshair;
    -webkit-tap-highlight-color: transparent;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .mark, .whisper {
    position: fixed; left: 0; right: 0; text-align: center; pointer-events: none; user-select: none;
    font: 300 11px/1 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    letter-spacing: .6em; text-indent: .6em; color: #d6dbe8;
  }
  .mark { bottom: max(22px, env(safe-area-inset-bottom)); opacity: .16; }
  .whisper { bottom: calc(max(22px, env(safe-area-inset-bottom)) + 26px); opacity: 0; transition: opacity 2.4s ease; letter-spacing: .35em; text-indent: .35em; }
  .whisper.on { opacity: .24; }
</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>
<div class="mark">isbester</div>
<div class="whisper" id="w"></div>
<script>
(() => {
  'use strict';
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const whisper = document.getElementById('w');
  const rm = matchMedia('(prefers-reduced-motion: reduce)');
  const TAU = Math.PI * 2;

  let W = 0, H = 0, dpr = 1, margin = 60;
  // Stars (struct-of-arrays). BX/BY: drifting sky position. X/Y: where it appears after lensing.
  let N = 0, G = 0, BX, BY, X, Y, Z, MAG, PH, TW, COL;
  let LMAX = 120;                 // longest link the graph will form
  let sprites = [];
  const links = new Map();        // key a*65536+b (a<b) -> {a, b, al, tg}

  const ptr = { x: -1e4, y: -1e4, on: false, sx: 0, sy: 0 };
  let lensE = 0;                  // cursor's Einstein radius, eased in/out
  let E_CURSOR = 70;
  const ghost = { x: 0, y: 0, E: 26, seed: Math.random() * 100 };
  let heading = Math.random() * TAU, t = 0, frameNo = 0;
  let pulse = null, nextPulse = 0, spoke = false, nearGhostFor = 0;

  // ---------- construction ----------
  function makeSprite(rgb) {
    const s = 32, c = document.createElement('canvas');
    c.width = c.height = s;
    const g = c.getContext('2d'), r = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
    r.addColorStop(0, `rgba(${rgb},1)`); r.addColorStop(0.12, `rgba(${rgb},.55)`);
    r.addColorStop(0.35, `rgba(${rgb},.12)`); r.addColorStop(1, `rgba(${rgb},0)`);
    g.fillStyle = r; g.fillRect(0, 0, s, s);
    return c;
  }
  // Stellar temperatures: cool blue-white through pale gold, one faint ember.
  const PALETTE = ['205,218,255', '232,236,250', '255,244,226', '255,222,190', '255,170,150'];

  function build() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    if (!sprites.length) sprites = PALETTE.map(makeSprite);

    const area = W * H;
    // First G stars are "graph" stars (nearer, linkable); the rest are background dust.
    G = Math.round(Math.max(70, Math.min(420, area / 4200)));
    N = G + Math.round(Math.max(300, Math.min(2200, area / 850)));
    LMAX = Math.sqrt(area / G) * 1.55;
    margin = LMAX;
    E_CURSOR = Math.max(54, Math.min(96, Math.min(W, H) * 0.1));
    ghost.E = E_CURSOR * 0.4;

    BX = new Float32Array(N); BY = new Float32Array(N); X = new Float32Array(N); Y = new Float32Array(N);
    Z = new Float32Array(N); MAG = new Float32Array(N); PH = new Float32Array(N); TW = new Float32Array(N);
    COL = new Uint8Array(N);
    for (let i = 0; i < N; i++) {
      BX[i] = X[i] = Math.random() * (W + 2 * margin) - margin;
      BY[i] = Y[i] = Math.random() * (H + 2 * margin) - margin;
      const graph = i < G;
      Z[i] = graph ? 0.55 + Math.random() * 0.45 : 0.12 + Math.random() * 0.4;
      // Few bright, many faint.
      MAG[i] = graph ? 0.35 + Math.pow(Math.random(), 3) * 0.65 : 0.15 + Math.pow(Math.random(), 4) * 0.5;
      PH[i] = Math.random() * TAU; TW[i] = 0.6 + Math.random() * 2.2;
      const r = Math.random();
      COL[i] = r < 0.3 ? 0 : r < 0.72 ? 1 : r < 0.9 ? 2 : r < 0.985 ? 3 : 4;
    }
    links.clear();
    pulse = null;
  }

  // ---------- lensing: thin point mass, radial map d -> (d + sqrt(d^2 + 4E^2)) / 2 ----------
  function lens(i, mx, my, E) {
    const dx = X[i] - mx, dy = Y[i] - my;
    const d = Math.sqrt(dx * dx + dy * dy) + 1e-3;
    const nd = (d + Math.sqrt(d * d + 4 * E * E)) / 2;
    const k = nd / d;
    X[i] = mx + dx * k; Y[i] = my + dy * k;
    return nd;
  }

  function step(now) {
    t += 1 / 60; frameNo++;
    // The sky drifts; the heading wanders so it never settles into one direction.
    heading += Math.sin(t * 0.05) * 0.0009;
    const vx = Math.cos(heading) * 0.11, vy = Math.sin(heading) * 0.11;
    const spanX = W + 2 * margin, spanY = H + 2 * margin;

    lensE += ((ptr.on ? E_CURSOR : 0) - lensE) * (ptr.on ? 0.06 : 0.03);
    // Pointer parallax, eased so it never snaps.
    const px = ptr.on ? (ptr.x - W / 2) : 0, py = ptr.on ? (ptr.y - H / 2) : 0;
    ptr.sx += (px - ptr.sx) * 0.03; ptr.sy += (py - ptr.sy) * 0.03;

    // The unseen mass wanders a slow Lissajous path.
    const s = ghost.seed;
    ghost.x = W * (0.5 + 0.36 * Math.sin(t * 0.021 + s) * Math.cos(t * 0.013 + s * 2));
    ghost.y = H * (0.5 + 0.34 * Math.sin(t * 0.017 + s * 3));

    const mx = ptr.x, my = ptr.y, E = lensE, E2 = E * 1.25;
    for (let i = 0; i < N; i++) {
      const z = Z[i];
      let bx = BX[i] + vx * z, by = BY[i] + vy * z;
      if (bx < -margin) bx += spanX; else if (bx > W + margin) bx -= spanX;
      if (by < -margin) by += spanY; else if (by > H + margin) by -= spanY;
      BX[i] = bx; BY[i] = by;
      X[i] = bx - ptr.sx * 0.02 * z; Y[i] = by - ptr.sy * 0.02 * z;
      lens(i, ghost.x, ghost.y, ghost.E);
      if (E > 0.5) {
        const nd = lens(i, mx, my, E);
        // Stars crowding the Einstein ring shiver.
        const ring = Math.abs(nd - E2);
        if (ring < E) { const q = (1 - ring / E) * 1.4; X[i] += (Math.random() - 0.5) * q; Y[i] += (Math.random() - 0.5) * q; }
      }
    }

    if (frameNo % 3 === 0) relink();
    for (const [k, L] of links) {
      L.al += (L.tg - L.al) * (L.tg > L.al ? 0.035 : 0.06);
      if (L.tg === 0 && L.al < 0.01) links.delete(k);
    }

    // A signal sometimes runs along the graph, star to star.
    if (!pulse && now > nextPulse && links.size) startPulse();
    if (pulse) advancePulse();

    // Linger on the unseen mass and it notices.
    if (ptr.on && !spoke) {
      const dx = mx - ghost.x, dy = my - ghost.y;
      nearGhostFor = dx * dx + dy * dy < (E_CURSOR * 1.2) ** 2 ? nearGhostFor + 1 : 0;
      if (nearGhostFor > 50) {
        spoke = true; whisper.textContent = 'it noticed';
        whisper.classList.add('on');
        setTimeout(() => whisper.classList.remove('on'), 5200);
      }
    }
  }

  // Each graph star links to its two nearest neighbours within LMAX (spatial hash).
  // Links that stop qualifying fade out rather than vanish, so the graph visibly re-knits.
  const grid = new Map();
  function relink() {
    grid.clear();
    const cs = LMAX;
    for (let i = 0; i < G; i++) {
      const k = (Math.floor(X[i] / cs) + 1000) * 4096 + (Math.floor(Y[i] / cs) + 1000);
      let b = grid.get(k); if (!b) grid.set(k, b = []); b.push(i);
    }
    for (const L of links.values()) L.tg = 0;
    const L2 = LMAX * LMAX;
    for (let i = 0; i < G; i++) {
      const gx = Math.floor(X[i] / cs) + 1000, gy = Math.floor(Y[i] / cs) + 1000;
      let n1 = -1, n2 = -1, d1 = L2, d2 = L2;
      for (let ox = -1; ox <= 1; ox++) for (let oy = -1; oy <= 1; oy++) {
        const b = grid.get((gx + ox) * 4096 + gy + oy); if (!b) continue;
        for (let n = 0; n < b.length; n++) {
          const j = b[n]; if (j === i) continue;
          const dx = X[j] - X[i], dy = Y[j] - Y[i], d = dx * dx + dy * dy;
          if (d < d1) { n2 = n1; d2 = d1; n1 = j; d1 = d; } else if (d < d2) { n2 = j; d2 = d; }
        }
      }
      if (n1 >= 0) want(i, n1);
      if (n2 >= 0) want(i, n2);
    }
  }
  function want(a, b) {
    if (a > b) { const s = a; a = b; b = s; }
    const k = a * 65536 + b;
    const L = links.get(k);
    if (L) L.tg = 1; else links.set(k, { a, b, al: 0, tg: 1 });
  }

  const onScreen = i => X[i] > 0 && X[i] < W && Y[i] > 0 && Y[i] < H;
  function startPulse() {
    const arr = [];
    for (const L of links.values()) if (L.al > 0.6 && onScreen(L.a)) arr.push(L);
    if (!arr.length) { nextPulse = performance.now() + 2000; return; }
    const L = arr[(Math.random() * arr.length) | 0];
    pulse = { a: L.a, b: L.b, p: 0, hops: 5 + ((Math.random() * 9) | 0), trail: [] };
  }
  function advancePulse() {
    const P = pulse;
    const dx = X[P.b] - X[P.a], dy = Y[P.b] - Y[P.a];
    const len = Math.sqrt(dx * dx + dy * dy) + 1e-3;
    if (len > LMAX * 1.8) { pulse = null; return; }   // endpoint wrapped across the sky
    P.p += 2.6 / len;
    const f = Math.min(P.p, 1);
    P.trail.push(X[P.a] + dx * f, Y[P.a] + dy * f);
    if (P.trail.length > 48) P.trail.splice(0, 2);
    if (P.p < 1) return;
    // Arrived: continue along any live link except the one it came from.
    const opts = [];
    for (const L of links.values()) {
      if (L.al < 0.5) continue;
      if (L.a === P.b && L.b !== P.a) opts.push(L.b);
      else if (L.b === P.b && L.a !== P.a) opts.push(L.a);
    }
    if (--P.hops <= 0 || !opts.length) { pulse = null; nextPulse = performance.now() + 4000 + Math.random() * 7000; return; }
    P.a = P.b; P.b = opts[(Math.random() * opts.length) | 0]; P.p = 0;
  }

  // ---------- rendering ----------
  const LEVELS = [0.05, 0.1, 0.17, 0.27, 0.42];
  const buckets = LEVELS.map(() => []);

  function draw(staticMode) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    const on = ptr.on && !staticMode && lensE > 1;
    const mx = ptr.x, my = ptr.y, PR = E_CURSOR * 3.2;

    // Links, batched into a few alpha levels so each level is one stroke.
    for (const b of buckets) b.length = 0;
    for (const L of links.values()) {
      const a = L.a, b = L.b;
      const dx = X[b] - X[a], dy = Y[b] - Y[a], d = Math.sqrt(dx * dx + dy * dy);
      if (d > LMAX * 1.8) continue;                  // wrapped across the sky edge
      let v = L.al * (0.26 - 0.16 * Math.min(1, d / LMAX)) * (0.6 + 0.4 * Math.min(Z[a], Z[b]));
      if (on) {
        const md = Math.hypot((X[a] + X[b]) / 2 - mx, (Y[a] + Y[b]) / 2 - my);
        if (md < PR) v += L.al * (1 - md / PR) * 0.3;
      }
      if (v < 0.02) continue;
      let k = 0; while (k < LEVELS.length - 1 && v > LEVELS[k + 1]) k++;
      buckets[k].push(L);
    }
    ctx.lineWidth = 0.6;
    for (let k = 0; k < LEVELS.length; k++) {
      const list = buckets[k]; if (!list.length) continue;
      ctx.strokeStyle = `rgba(178,192,232,${LEVELS[k]})`;
      ctx.beginPath();
      for (const L of list) { ctx.moveTo(X[L.a], Y[L.a]); ctx.lineTo(X[L.b], Y[L.b]); }
      ctx.stroke();
    }

    // Masses: a darkened core, and for the cursor a faint Einstein ring.
    if (!staticMode) {
      core(ghost.x, ghost.y, ghost.E * 1.3, 0.4);
      if (lensE > 1) {
        core(mx, my, lensE * 0.9, 0.85 * lensE / E_CURSOR);
        ctx.lineWidth = 1;
        ctx.strokeStyle = `rgba(190,205,255,${0.07 * lensE / E_CURSOR})`;
        ctx.beginPath(); ctx.arc(mx, my, lensE * 1.02, 0, TAU); ctx.stroke();
      }
    }

    // Tethers: nearby graph stars reach toward the cursor and stop at its ring, shivering.
    if (on) {
      const TR = PR * 0.75;
      ctx.lineWidth = 0.6;
      ctx.beginPath();
      let n = 0;
      for (let i = 0; i < G && n < 9; i++) {
        const dx = X[i] - mx, dy = Y[i] - my, d = Math.sqrt(dx * dx + dy * dy);
        if (d > TR || d < lensE) continue;
        n++;
        const ex = mx + dx / d * lensE * 1.02 + (Math.random() - 0.5) * 1.5;
        const ey = my + dy / d * lensE * 1.02 + (Math.random() - 0.5) * 1.5;
        ctx.moveTo(X[i], Y[i]); ctx.lineTo(ex, ey);
      }
      ctx.strokeStyle = `rgba(190,205,255,${0.16 * lensE / E_CURSOR})`;
      ctx.stroke();
    }

    // Stars: dust as tiny squares, graph stars as glow sprites.
    const tw = staticMode ? 0 : t;
    for (let i = G; i < N; i++) {
      const a = MAG[i] * (0.7 + 0.3 * Math.sin(tw * TW[i] + PH[i]));
      ctx.fillStyle = `rgba(${PALETTE[COL[i]]},${Math.min(1, a * 1.1)})`;
      const r = 0.5 + Z[i] * 0.9;
      ctx.fillRect(X[i] - r / 2, Y[i] - r / 2, r, r);
    }
    for (let i = 0; i < G; i++) {
      let a = MAG[i] * (0.75 + 0.25 * Math.sin(tw * TW[i] + PH[i]));
      if (on) { const d = Math.hypot(X[i] - mx, Y[i] - my); if (d < PR) a = Math.min(1, a + (1 - d / PR) * 0.4); }
      ctx.globalAlpha = a;
      const s = 4 + MAG[i] * Z[i] * 14;
      ctx.drawImage(sprites[COL[i]], X[i] - s / 2, Y[i] - s / 2, s, s);
    }
    ctx.globalAlpha = 1;

    // The signal and its fading trail.
    if (pulse && pulse.trail.length > 3) {
      const tr = pulse.trail, n = tr.length / 2;
      ctx.lineWidth = 1;
      for (let s = 1; s < n; s++) {
        ctx.strokeStyle = `rgba(220,230,255,${(s / n) * 0.55})`;
        ctx.beginPath(); ctx.moveTo(tr[2 * s - 2], tr[2 * s - 1]); ctx.lineTo(tr[2 * s], tr[2 * s + 1]); ctx.stroke();
      }
      ctx.globalAlpha = 0.9;
      ctx.drawImage(sprites[0], tr[tr.length - 2] - 7, tr[tr.length - 1] - 7, 14, 14);
      ctx.globalAlpha = 1;
    }
  }

  function core(x, y, r, a) {
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, `rgba(1,1,4,${a})`); g.addColorStop(0.7, `rgba(1,1,4,${a * 0.6})`); g.addColorStop(1, 'rgba(1,1,4,0)');
    ctx.fillStyle = g; ctx.fillRect(x - r, y - r, 2 * r, 2 * r);
  }

  // ---------- loop / lifecycle ----------
  let raf = 0, acc = 0, lastT = 0;
  const probe = { n: 0, sum: 0 };
  function frame(now) {
    raf = requestAnimationFrame(frame);
    if (!lastT) lastT = now;
    const dt = now - lastT;
    acc += Math.min(dt, 100); lastT = now;
    // Adaptive quality: if the first ~2s run slow at high DPI, drop to a 1x backing store.
    if (probe.n < 120) {
      probe.n++; probe.sum += dt;
      if (probe.n === 120 && probe.sum / 120 > 22 && dpr > 1) { dpr = 1; cv.width = W; cv.height = H; }
    }
    let steps = 0;
    // Fixed 60 Hz simulation; at most 2 catch-up steps so a slow frame can't spiral.
    while (acc >= 1000 / 60 && steps < 2) { step(now); acc -= 1000 / 60; steps++; }
    if (steps === 2) acc = 0;
    if (steps) draw(false);
  }

  function start() {
    cancelAnimationFrame(raf); raf = 0; lastT = 0; acc = 0; probe.n = 0; probe.sum = 0;
    build();
    if (rm.matches) {
      // Reduced motion: one fully knit frame, then nothing moves.
      ptr.on = false; lensE = 0;
      relink();
      for (const L of links.values()) L.al = 1;
      draw(true);
    } else {
      nextPulse = performance.now() + 2500;
      raf = requestAnimationFrame(frame);
    }
  }

  function setPtr(e) {
    // Some engines synthesize a zero-movement pointermove at (0,0) on load; it isn't a person.
    if (e.type === 'pointermove' && e.clientX === 0 && e.clientY === 0 && !e.movementX && !e.movementY) return;
    ptr.x = e.clientX; ptr.y = e.clientY; ptr.on = true;
  }
  addEventListener('pointermove', setPtr, { passive: true });
  addEventListener('pointerdown', setPtr, { passive: true });
  addEventListener('pointerup', e => { if (e.pointerType !== 'mouse') ptr.on = false; }, { passive: true });
  addEventListener('pointercancel', () => { ptr.on = false; }, { passive: true });
  document.documentElement.addEventListener('mouseleave', () => { ptr.on = false; });
  addEventListener('blur', () => { ptr.on = false; });

  let rt = 0;
  addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(start, 150); });
  rm.addEventListener ? rm.addEventListener('change', start) : rm.addListener(start);

  start();
})();
</script>
</body>
</html>
